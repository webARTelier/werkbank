<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
  <!--
    Play control glyph. The slightly darkened disc is baked in (literal
    translucent black) so the file works on any footage; ring and glyph
    use currentColor so the embedding context picks the light tone.
    Opacity/hover behaviour is the embedding button's CSS, not the file's.
  -->
  <circle cx="24" cy="24" r="22.5" fill="rgba(0, 0, 0, 0.45)" stroke="currentColor" stroke-width="1.5" />
  <path d="M19.5 15.5 34 24l-14.5 8.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
</svg>
