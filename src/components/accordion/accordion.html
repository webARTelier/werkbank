<!--
  accordion — copy-paste snippet
  ============================================================================
  Copy the block(s) below into your own project.

  1) In <head> (or before </body>): load the shared styles, this component's
     styles and the boot script. boot.min.js lazily loads the accordion module
     as soon as it finds data-js-module="accordion" in the DOM — you do not
     import accordion.js yourself. Adjust the paths to where you serve /dist.

       <link rel="stylesheet" href="/dist/css/shared.min.css" />
       <link rel="stylesheet" href="/dist/css/accordion.min.css" />
       <script type="module" src="/dist/js/boot.min.js"></script>

  2) Drop the markup below where the accordion should appear. It is built on
     native <details>/<summary>, so open/close works without JavaScript; the
     module only adds a smooth height animation in browsers that still lack
     ::details-content + interpolate-size (currently e.g. Firefox and Safari).

  Notes
    - Each item is a <details data-accordion-item> holding a <summary> and a
      <div data-accordion-panel>. Both the summary and the panel are required.
    - Single-open (only one panel open at a time): give every <details> in a
      group the same name attribute, so they behave like radio buttons — see
      the first block below.
    - Multi-open (several panels open independently): omit the name attribute —
      see the second block below.
-->

<!-- Single-open: same name="" on all items -> only one open at a time -->
<div class="m-accordion" data-js-module="accordion">

  <details class="m-accordion__item" data-accordion-item name="accordion-single">
    <summary class="m-accordion__trigger">
      <h2 class="m-accordion__title">Trigger 1</h2>
    </summary>
    <div class="m-accordion__panel" data-accordion-panel>
      <p>Panel content 1 …</p>
    </div>
  </details>

  <details class="m-accordion__item" data-accordion-item name="accordion-single">
    <summary class="m-accordion__trigger">
      <h2 class="m-accordion__title">Trigger 2</h2>
    </summary>
    <div class="m-accordion__panel" data-accordion-panel>
      <p>Panel content 2 …</p>
    </div>
  </details>

</div>



<!-- Multi-open: omit name -> panels toggle independently -->
<div class="m-accordion" data-js-module="accordion">

  <details class="m-accordion__item" data-accordion-item>
    <summary class="m-accordion__trigger">
      <h2 class="m-accordion__title">Trigger A</h2>
    </summary>
    <div class="m-accordion__panel" data-accordion-panel>
      <p>Panel content A …</p>
    </div>
  </details>

  <details class="m-accordion__item" data-accordion-item>
    <summary class="m-accordion__trigger">
      <h2 class="m-accordion__title">Trigger B</h2>
    </summary>
    <div class="m-accordion__panel" data-accordion-panel>
      <p>Panel content B …</p>
    </div>
  </details>

</div>
