<!--
  dialog — copy-paste snippet
  ============================================================================
  Copy the block(s) below into your own project.

  1) In <head> (or before </body>): load the shared styles, this component's
     styles and the boot script. boot.min.js lazily loads the dialog module as
     soon as it finds data-js-behavior="dialog" in the DOM — you do not import
     dialog.js yourself. Adjust the paths to where you serve /dist.

       <link rel="stylesheet" href="/dist/css/shared.min.css" />
       <link rel="stylesheet" href="/dist/css/dialog.min.css" />
       <script type="module" src="/dist/js/boot.min.js"></script>

  2) Drop the markup below where the dialog should appear. It is built on the
     native <dialog> element, so the top layer, focus trap, ::backdrop, Escape
     and focus restoration all come from the browser. The module only wires the
     outside trigger, adds backdrop-click dismissal, locks body scroll and stops
     media on close.

  Wiring
    - The dialog is a <dialog data-js-behavior="dialog"> with a unique id.
    - An open trigger anywhere on the page carries data-open-dialog="<that id>".
    - A close control inside the dialog carries data-close-dialog (any element;
      a <form method="dialog"> submit closes it natively too).
    - The dialog is modal by default (showModal). Add data-dialog-nonmodal for a
      non-modal dialog (show) that leaves the rest of the page interactive.
      NOTE: Escape only closes a *modal* dialog — the platform fires no cancel/
      close for a non-modal one — so a non-modal dialog must always keep a
      visible close control (the × button or a footer action).
    - Add data-dialog-static to disable backdrop-click and Escape dismissal
      (e.g. a dialog that must be dismissed with an explicit action).
    - Mark an embedded media <iframe> (e.g. a video) with data-dialog-media so
      it is reloaded on close and stops playing. Frames without it are left
      untouched, keeping their state (a map, an embedded form, an app).
    - aria-labelledby points at the title so screen readers announce the dialog.
    - data-dialog-scroll marks the scrollable content region. When it overflows
      and holds nothing else focusable, the JS makes it keyboard scrollable and
      names it from the dialog title (WCAG 2.1.1 / 4.1.2).
-->



<!-- The button that opens the dialog (can live anywhere on the page) -->
<button type="button" data-open-dialog="dialog-example">Open dialog</button>



<!-- The dialog element -->
<dialog
  id="dialog-example"
  class="m-dialog"
  data-js-behavior="dialog"
  aria-labelledby="dialog-example-title"
>
  <div class="m-dialog__panel">

    <header class="m-dialog__header">
      <h2 class="m-dialog__title" id="dialog-example-title">Dialog title</h2>
      <!--
        Close icon: the "×" glyph inlined from
        src/_shared/media/img/icons/close.svg (the canonical source). It is
        embedded rather than <img>-referenced so stroke="currentColor" inherits
        the button colour (and its hover state). aria-hidden keeps it silent —
        the button's aria-label names the control.
      -->
      <button
        type="button"
        class="m-dialog__close"
        data-close-dialog
        aria-label="Close dialog"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M6 6 18 18M18 6 6 18" />
        </svg>
      </button>
    </header>

    <div class="m-dialog__body" data-dialog-scroll>
      <p>Dialog content goes here.</p>
    </div>

    <footer class="m-dialog__footer">
      <button type="button" data-close-dialog>Cancel</button>
      <button type="button">Confirm</button>
    </footer>

  </div>
</dialog>
