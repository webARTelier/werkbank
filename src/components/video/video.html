<!--
  video — copy-paste snippet
  ============================================================================
  Copy the block(s) below into your own project.

  1) In <head> (or before </body>): load the shared styles, this component's
     stylesheet and the boot script. boot.min.js lazily loads the
     video module as soon as it finds
     data-js-behavior="video" in the DOM — you do not import
     video.js yourself. Adjust the paths to where you serve /dist.

       <link rel="stylesheet" href="/dist/css/shared.min.css" />
       <link rel="stylesheet" href="/dist/css/video.min.css" />
       <script type="module" src="/dist/js/boot.min.js"></script>

  2) Give every instance its own media container: the project layout owns
     size and aspect ratio (e.g. `aspect-ratio: 16 / 9` on the wrapper);
     the module root fills the container and the <video> covers it via
     object-fit: cover.

  3) SELF-HOSTED VIDEO ONLY. For YouTube, Vimeo or any other third-party
     embed, use `embedConsent` — the click-to-load facade that used to be
     variant C of this component lives there now, with the consent notice
     and the consent-platform seam it was missing. Nothing about this
     component knows a third-party host any more.

  4) Pick a variant:

     A) Self-hosted, click-to-play (default)
        The <video> ships native `controls` — the fully working no-JS
        baseline. The script takes the controls over and puts one centered
        play button in front; clicking it swaps button for controls and
        plays; pause/end swaps back.

     B) Self-hosted, ambient loop
        `autoplay muted loop playsinline` on the <video> — runs natively
        without JS. The script adds the persistent corner play/pause
        toggle (WCAG 2.2.2) and prevents the autostart under
        prefers-reduced-motion (pressing play is the explicit opt-in).
        The corner placement is the author-set m-video--ambient
        modifier class; the behaviour follows the `autoplay` attribute.

  Responsive sources
    Declare one <source media="…"> per variant — first match wins, exactly
    like the native rule; keep ONE source without a media attribute as the
    fallback, last in the list. This covers both art direction (different
    footage/ratio per viewport, e.g. `(max-width: 767px)`) and resolution
    ladders (same footage, e.g. `(min-width: 990px) and (min-resolution:
    2dppx)`). The script re-evaluates on every media-query change (resize,
    rotation) and carries playback position and play state over to the
    newly chosen source.

  Wiring
    - data-js-behavior="video" goes on the module element.
      (Combine with other modules via a comma: data-js-behavior="a,b".)
    - The <button data-video-toggle hidden> keeps its `hidden`
      attribute: the script reveals it once it is functional, so a page
      without JS never shows a dead control. Leave the button empty of
      text — the script sets a localized aria-label (de/en from
      <html lang>) that switches between play and pause.
    - The inline SVGs are copies of _shared/media/img/system/play.svg and
      pause.svg (the build does not copy media into /dist, hence inline).
      Ring and glyph use currentColor; the darkened disc is baked in.
    - The m-video* classes are styling hooks for the CSS only;
      the JS binds exclusively to the data attributes.

  Notes / Configuration
    - [data-video-toggle]             the play / play-pause button,
                                                shipped `hidden`.
    - is-playing (class, written by the JS)     styling hook on the module
                                                element, drives the icon
                                                swap.
    - --video-* (CSS custom props)    toggle size, corner inset,
                                                color, resting opacity —
                                                see video.scss.

  The `your-media-container` wrappers below are placeholders for YOUR
  layout element: replace the class and give it size and aspect ratio in
  your project's CSS (e.g. `aspect-ratio: 16 / 9`). Kept as a class, not
  an inline style, so structure and appearance stay separated.
-->



<!-- A) Self-hosted, click-to-play. Media container: e.g. 16 / 9. -->
<div class="your-media-container">
  <div class="m-video" data-js-behavior="video">

    <video class="m-video__video" poster="/media/videoPoster.jpg" controls preload="metadata" playsinline>
      <source src="/media/video-portrait-720.mp4" media="(max-width: 767px)">
      <source src="/media/video-1920.mp4" media="(min-width: 990px) and (min-resolution: 2dppx)">
      <source src="/media/video-1280.mp4" media="(min-width: 990px)">
      <source src="/media/video-960.mp4">
    </video>

    <button class="m-video__toggle" type="button" data-video-toggle hidden>
      <svg class="m-video__icon m-video__icon--play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="22.5" fill="rgba(0, 0, 0, 0.45)" stroke="currentColor" stroke-width="1.5" />
        <path d="M19.5 15.5 34 24l-14.5 8.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </svg>
    </button>

  </div>
</div>



<!-- B) Self-hosted, ambient loop: autoplay muted loop playsinline, the
     persistent play/pause toggle sits in the corner (--ambient).
     Media container: ambient loops often run wider, e.g. 21 / 9. -->
<div class="your-media-container">
  <div class="m-video m-video--ambient" data-js-behavior="video">

    <video class="m-video__video" autoplay muted loop playsinline preload="auto">
      <source src="/media/ambient-1920.mp4" media="(min-width: 990px)">
      <source src="/media/ambient-960.mp4">
    </video>

    <button class="m-video__toggle" type="button" data-video-toggle hidden>
      <svg class="m-video__icon m-video__icon--play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="22.5" fill="rgba(0, 0, 0, 0.45)" stroke="currentColor" stroke-width="1.5" />
        <path d="M19.5 15.5 34 24l-14.5 8.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <svg class="m-video__icon m-video__icon--pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="22.5" fill="rgba(0, 0, 0, 0.45)" stroke="currentColor" stroke-width="1.5" />
        <rect x="17.5" y="15.5" width="4.5" height="17" rx="1.5" fill="currentColor" />
        <rect x="26" y="15.5" width="4.5" height="17" rx="1.5" fill="currentColor" />
      </svg>
    </button>

  </div>
</div>
