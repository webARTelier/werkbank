<!--
  flexNeighborMarker — copy-paste snippet
  ============================================================================
  Copy the block below into your own project.

  1) In <head> (or before </body>): load the shared styles, this component's
     styles and the boot script. boot.min.js lazily loads the flexNeighborMarker
     module as soon as it finds data-js-behavior="flexNeighborMarker" in the DOM —
     you do not import flexNeighborMarker.js yourself. Adjust the paths to where
     you serve /dist.

       <link rel="stylesheet" href="/dist/css/shared.min.css" />
       <link rel="stylesheet" href="/dist/css/flexNeighborMarker.min.css" />
       <script type="module" src="/dist/js/boot.min.js"></script>

  2) Drop the markup below where the wrapping row should appear.
       - Put data-js-behavior="flexNeighborMarker" on the flex container. Its
         direct children are the items; whenever an item is followed by a
         sibling in the SAME visual row it receives the class "has-neighbor".
       - .m-flexNeighbor is an optional convenience: a wrapping flex row + gap
         plus a default hairline divider between row-neighbours. Lay the
         container out however you like and restyle .has-neighbor to taste — the
         script only toggles the class, it does not read .m-flexNeighbor.

  Notes
    - Pure progressive enhancement: without JavaScript the class is never added,
      so the layout stays intact — the marking (and any styling keyed on it)
      simply does not appear.
    - The class is decorative only: it describes a same-row relationship that
      does not exist without JS and changes on every resize, so never let
      anything meaningful to assistive tech depend on it.
    - Optional config (attributes on the container):
        data-neighbor-container   mark descendant containers to scan several
                                  at once; put data-js-behavior on a shared
                                  wrapper
-->



<!-- Basic: the flex container is the module element -->
<ul class="m-flexNeighbor" data-js-behavior="flexNeighborMarker">
  <li>First</li>
  <li>Second</li>
  <li>Third</li>
  <li>Fourth</li>
  <li>Fifth</li>
  <li>Sixth</li>
</ul>



<!-- Advanced: one wrapper drives several flex containers -->
<div data-js-behavior="flexNeighborMarker">
  <ul class="m-flexNeighbor" data-neighbor-container>
    <li>Group A · one</li>
    <li>Group A · two</li>
    <li>Group A · three</li>
  </ul>
  <ul class="m-flexNeighbor" data-neighbor-container>
    <li>Group B · one</li>
    <li>Group B · two</li>
    <li>Group B · three</li>
  </ul>
</div>
