<!--
  passwordToggle — copy-paste snippet
  ============================================================================
  Copy the block(s) below into your own project.

  1) In <head> (or before </body>): load the shared styles, this component's
     stylesheet and the boot script. boot.min.js lazily loads the
     passwordToggle module as soon as it finds
     data-js-behavior="passwordToggle" in the DOM — you do not import
     passwordToggle.js yourself. Adjust the paths to where you serve /dist.

       <link rel="stylesheet" href="/dist/css/shared.min.css" />
       <link rel="stylesheet" href="/dist/css/passwordToggle.min.css" />
       <script type="module" src="/dist/js/boot.min.js"></script>

  2) Wrap EACH password field in an element carrying
     class="c-passwordToggle" and data-js-behavior="passwordToggle", and put
     class="c-passwordToggle__field" on the field itself. The module finds the
     field by what it is (input[type="password"]) and injects the button
     after it; you write no button.

  Wiring
    - The wrapper holds the field and nothing else. The <label> goes OUTSIDE
      it — the wrapper is a flex row, and a label inside it would become a
      second item in that row.
    - Keep the field's autocomplete token ("current-password" on a login,
      "new-password" on a sign-up or a change-password form). The component
      never touches it, and it is what the browser's password manager reads.
      That manager also wants the field inside a <form>, next to a username
      field carrying autocomplete="username" — none of which is this
      component's doing, but all of which it leaves intact, and the form is
      also what the re-masking below listens to.
    - Style the field as you style your other fields — border, padding,
      colours, its own :focus-visible ring. This component styles the button
      and nothing else (see Styling below).
    - The module sets spellcheck="false", autocapitalize="none" and
      autocorrect="off" on the field. All three are inert while the value is
      masked and load-bearing the moment it is text: a spell checker would
      treat a password as a word (and some send what they check to a server),
      and a phone keyboard would capitalize and autocorrect it.
    - Nothing else about the field changes — same node, same name, same
      value, same id. Only the type attribute is switched, so the form posts
      exactly what it posted before.

  Options
    - data-passwordtoggle-label="…"  on the WRAPPER: the button's accessible
                                     name. Defaults to the built-in wording
                                     for <html lang> ("Show password" /
                                     "Passwort anzeigen"), English elsewhere
                                     — and there the module marks the name
                                     lang="en", because it is then a passage
                                     in a language the page has not declared.
                                     Give the button your own wording on a
                                     page in any third language; that is what
                                     this attribute is for. The name stays
                                     constant while the state is announced
                                     through aria-pressed, so phrase it as
                                     one label, not as two.
    - class="c-passwordToggle--beside"  puts the button NEXT to the field
                                     instead of over its inline-end edge. Use
                                     it where the field's padding is not
                                     yours to give up, or where the field is
                                     too short to spare a gutter (a PIN, an
                                     inline login). In that placement the
                                     component touches nothing of the field's
                                     box at all.

  Styling (all of it CSS, all of it on the WRAPPER)
    - --passwordToggle-button-size   the hit area (2.25rem = 36px, past the
                                     24px of WCAG 2.5.8)
    - --passwordToggle-icon-size     the glyph inside it (1.25rem)
    - --passwordToggle-radius        the button's corner (--borderRadius)
    - --passwordToggle-inset         between button and the field's edge
                                     (--space-3xs)
    - --passwordToggle-gap           --beside only: field to button
                                     (--space-2xs)
    - --passwordToggle-gutter        the padding reserved in the field for
                                     the button (button-size + 2 × inset).
                                     Derived, so retuning the two above is
                                     usually enough
    - --passwordToggle-color / -color-hover / -bg-color-hover   the button's
                                     resting and hover tones
    - --passwordToggle-icon-show / -icon-hide   the two glyphs, as mask URLs.
                                     Replace them to use your own icon set;
                                     keep them two distinct SHAPES, because
                                     that is what carries the state in
                                     greyscale, in print and in a
                                     forced-colors theme
    - --passwordToggle-duration / -easing   the hover transition

    Not on an ancestor: the component declares every one of them on its own
    root, and a declaration on the element beats an inherited value whatever
    the ancestor's specificity is. So set them inline
    (style="--passwordToggle-button-size: 2rem") or in a rule that hits the
    wrapper itself.

  Notes / progressive enhancement
    - There is no pre-enhancement state and nothing can flash: before the
      module arrives the wrapper is an empty flex row around a perfectly
      ordinary password field. If the chunk never arrives, that is what stays
      — the field, its label, its autocomplete and the browser's password
      manager, all untouched.
    - Which is why the button is injected rather than authored. A "show
      password" button written into the markup would be a control that does
      nothing until a script arrives, and there is no fallback that could
      make it work: the type attribute is the only switch a password field
      has, and no element, attribute or CSS state can flip it.
    - Two rules wait for data-passwordtoggle-ready, and both of them hand
      something over to a control that has to exist first: the gutter in the
      field (otherwise an empty notch), and the removal of Edge's own reveal
      control (otherwise the reader is left with less than the platform gave
      them). Edge on Windows is the only engine that ships one.
    - The reveal is a moment, not a setting: it starts off, it is never
      remembered between fields or page loads, and submitting the form masks
      the field again — so a page coming back from the back/forward cache or
      from a failed validation never comes back with the password on screen.
    - Focus stays on the button when it is pressed. The reader pressed it in
      order to look, not in order to type.

  Accessibility
    - The button is a toggle button with a CONSTANT name and its state in
      aria-pressed: whether the password is legible right now is the fact
      that matters, and a name changing under the reader would announce it as
      an action instead. (video does the opposite with its play/pause
      control, and for the opposite reason.)
    - The name is a real text node, hidden visually and only visually, so it
      still names the control if this stylesheet never loads. The glyph is a
      CSS mask drawn from aria-pressed, so there is nothing to announce twice
      and nothing that can drift out of step with the state.
    - Where the built-in wording is not the page's language, that text node
      carries its own lang, so a screen reader pronounces it with the right
      rules instead of reading "Show password" in the page's voice.
    - The button follows the field in the DOM, so the tab order needs no
      tabindex.
-->



<!-- The default: the button over the field's inline-end edge -->
<label class="myLabel" for="pt-current">Password</label>
<div class="c-passwordToggle" data-js-behavior="passwordToggle">
  <input
    class="myField c-passwordToggle__field"
    id="pt-current"
    name="password"
    type="password"
    autocomplete="current-password"
  >
</div>


<!-- Next to the field: nothing of the field's box is touched -->
<label class="myLabel" for="pt-pin">PIN</label>
<div class="c-passwordToggle c-passwordToggle--beside" data-js-behavior="passwordToggle">
  <input
    class="myField c-passwordToggle__field"
    id="pt-pin"
    name="pin"
    type="password"
    inputmode="numeric"
    autocomplete="off"
  >
</div>


<!-- A sign-up field: its own wording for the control, and a hint -->
<label class="myLabel" for="pt-new">Choose a password</label>
<div
  class="c-passwordToggle"
  data-passwordtoggle-label="Reveal the password"
  data-js-behavior="passwordToggle"
>
  <input
    class="myField c-passwordToggle__field"
    id="pt-new"
    name="newPassword"
    type="password"
    minlength="12"
    autocomplete="new-password"
    aria-describedby="pt-new-hint"
  >
</div>
<p class="myHint" id="pt-new-hint">At least 12 characters.</p>
