<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="werkbank">
  <defs>
    <linearGradient id="uic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#uic-bg)"/>
  <!-- 2x2 component grid -->
  <g fill="#f8fafc">
    <rect x="7"  y="7"  width="8" height="8" rx="2"/>
    <rect x="17" y="7"  width="8" height="8" rx="2" fill-opacity="0.55"/>
    <rect x="7"  y="17" width="8" height="8" rx="2" fill-opacity="0.55"/>
    <rect x="17" y="17" width="8" height="8" rx="2"/>
  </g>
</svg>
